# WAHA 2026.8 — variables recomendadas para el stack Portainer (servicio waha-worker-1).
# Imagen: devlikeapro/waha:2026.8.1 (pin; no usar :latest en producción).
#
# Aplicar en Portainer → Stack waha → Environment o en /var/lib/suite/waha-worker.env

services:
  waha-worker-1:
    image: devlikeapro/waha:2026.8.1
    environment:
      # Observabilidad (Prometheus; proteger /metrics en red interna)
      WAHA_PROMETHEUS_ENABLED: "True"
      # WAHA_PROMETHEUS_PATH: /metrics
      # WAHA_PROMETHEUS_USERNAME: admin
      # WAHA_PROMETHEUS_PASSWORD: secret

      # Descarga selectiva de media (menos ancho de banda en webhooks)
      WAHA_EVENTS_DOWNLOAD_MEDIA: "true"
      WAHA_EVENTS_DOWNLOAD_MEDIA_MIMETYPES: "audio,image/png,image/jpeg,image/webp"
      WAHA_API_DOWNLOAD_MEDIA: "true"
      WAHA_API_DOWNLOAD_MEDIA_MIMETYPES: "image,image/webp"

      # Resto de vars existentes (WAHA_API_KEY, WHATSAPP_DEFAULT_ENGINE, etc.)
      # se conservan del env file actual del contenedor.
